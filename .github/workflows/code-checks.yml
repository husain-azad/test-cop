name: 🧹 Code Quality Checks

on:
  push:
    branches:
      - dev_*
      - feat/*

jobs:
  code-checks:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9.20"

      - name: 🔧 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy pylint flake8 bandit radon vulture

      - name: 🧠 Run Code Quality Checks
        run: |
          set -euo pipefail
          echo "=========================================="
          echo "🚀 Starting Code Quality Checks"
          echo "=========================================="

          changed_files=$(git diff --name-only origin/${{ github.event.before }} ${{ github.sha }} | grep '.py$' || true)

          if [ -z "$changed_files" ]; then
            echo "✅ No Python files changed. Skipping checks."
            exit 0
          fi

          echo "🔍 Changed Python files:"
          echo "$changed_files"
          echo ""

          # Summary tracking
          ERRORS_FOUND=false
          SUMMARY=""

          for file in $changed_files; do
            echo "------------------------------------------"
            echo "🧾 Checking file: $file"
            echo "------------------------------------------"

            TOOL_ERRORS=""

            # === MYPY ===
            echo "▶ mypy $file"
            if ! mypy "$file"; then
              TOOL_ERRORS+="❌ mypy failed\n"
              ERRORS_FOUND=true
            else
              echo "✅ mypy passed"
            fi
            echo ""

            # === PYLINT ===
            echo "▶ pylint $file"
            if ! pylint "$file" -rn; then
              TOOL_ERRORS+="❌ pylint failed\n"
              ERRORS_FOUND=true
            else
              echo "✅ pylint passed"
            fi
            echo ""

            # === FLAKE8 ===
            echo "▶ flake8 $file"
            if ! flake8 "$file"; then
              TOOL_ERRORS+="❌ flake8 failed\n"
              ERRORS_FOUND=true
            else
              echo "✅ flake8 passed"
            fi
            echo ""

            # === BANDIT ===
            echo "▶ bandit $file"
            if ! bandit -q "$file"; then
              TOOL_ERRORS+="❌ bandit failed\n"
              ERRORS_FOUND=true
            else
              echo "✅ bandit passed"
            fi
            echo ""

            # === VULTURE ===
            echo "▶ vulture $file"
            if ! vulture "$file"; then
              TOOL_ERRORS+="❌ vulture failed\n"
              ERRORS_FOUND=true
            else
              echo "✅ vulture passed"
            fi
            echo ""

            if [ -n "$TOOL_ERRORS" ]; then
              SUMMARY+="\n🚨 $file:\n$TOOL_ERRORS"
            fi

            echo "✅ Finished checks for $file"
            echo ""
          done

          echo "=========================================="
          echo "📋 SUMMARY"
          echo "=========================================="

          if [ "$ERRORS_FOUND" = true ]; then
            echo -e "$SUMMARY"
            echo ""
            echo "❌ One or more checks failed. Please fix the issues above."
            exit 1
          else
            echo "✅ All code quality checks passed successfully!"
          fi
