name: Code Quality Checks

on:
  push:
    branches:
      - dev_*
      - feat/*

permissions:
  contents: write
  pull-requests: write

jobs:
  code-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9.20'

      - name: Install analysis tools and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            mypy==1.7.1 \
            pylint==3.0.3 \
            flake8==6.1.0 \
            bandit==1.7.5 \
            radon==6.0.1 \
            vulture==2.10 \
            safety==2.3.5

      # ==============================================================
      # IDENTIFY CHANGED PYTHON FILES
      # ==============================================================
      - name: Get changed Python files
        id: changed_files
        run: |
          echo "Checking changed Python files..."
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep '\.py$' || true)
          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo "files=$CHANGED_FILES" >> $GITHUB_OUTPUT

      # ==============================================================
      # RUN ANALYSIS ONLY ON CHANGED FILES
      # ==============================================================
      - name: Run checks only on changed files
        id: quality_checks
        if: steps.changed_files.outputs.files != ''
        run: |
          echo "Running checks on changed Python files..."
          echo "${{ steps.changed_files.outputs.files }}" | while read file; do
            if [ -n "$file" ]; then
              echo "🔍 Checking: $file"
              echo "------------------------------------------"

              echo "▶ Mypy"
              mypy --ignore-missing-imports "$file" || true

              echo "▶ Pylint"
              pylint --disable=C0114,C0115,C0116 --max-line-length=120 "$file" || true

              echo "▶ Bandit"
              bandit -f txt -r "$file" || true

              echo "▶ Flake8"
              flake8 --extend-ignore=E203,W503 --max-line-length=120 "$file" || true

              echo "▶ Radon (complexity)"
              radon cc "$file" -a || true

              echo "▶ Vulture (dead code)"
              vulture "$file" --min-confidence 80 || true

              echo "------------------------------------------"
            fi
          done

      - name: Skip check (no Python file changed)
        if: steps.changed_files.outputs.files == ''
        run: echo "✅ No Python files changed, skipping checks."

      # ==============================================================
      # GENERATE GITHUB SUMMARY
      # ==============================================================
      - name: Generate GitHub Summary
        if: always()
        run: |
          echo "# 📊 Code Quality Analysis (Changed Files Only)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Build Info" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Author:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.quality_checks.outcome }}" == "success" ]; then
            echo "✅ All checks passed for changed files." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.changed_files.outputs.files }}" == "" ]; then
            echo "ℹ️ No Python files changed, no checks required." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some checks failed. Please review the logs above." >> $GITHUB_STEP_SUMMARY
          fi
