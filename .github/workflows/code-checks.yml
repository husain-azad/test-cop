name: Code Quality Checks

on:
  push:
    branches:
      - dev_*
      - feat/*

jobs:
  code-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9.20'

      - name: Install dependencies for checks
        run: |
          python -m pip install --upgrade pip
          pip install mypy flake8 radon pylint astroid bandit

      # --- SYNTAX CHECK ---
      - name: Check for syntax errors
        run: |
          echo "🔍 Checking for syntax errors..."
          python -m compileall -q .

      # --- STRICT TYPE CHECKING WITH MYPY ---
      - name: Run MyPy (strict type checking)
        continue-on-error: true
        run: |
          echo "🧠 Running MyPy static analysis..."
          mypy --ignore-missing-imports --warn-return-any --warn-unused-ignores --disallow-untyped-defs --check-untyped-defs . || true

      # --- LINT CHECK ---
      - name: Run flake8 (code style & lint)
        run: |
          echo "🎨 Running flake8 linting..."
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # --- CODE COMPLEXITY CHECK ---
      - name: Analyze code complexity (Radon)
        run: |
          echo "⚙️ Checking for code complexity..."
          radon cc . -a -nc

      # --- RUNTIME TYPE COMPATIBILITY CHECK (YOUR MAIN ISSUE) ---
      - name: Validate type compatibility between functions
        run: |
          echo "🔬 Checking runtime type compatibility..."
          python <<'EOF'
          import ast, os, sys, json
          from collections import defaultdict
          from typing import Any, Dict, List, Set, Tuple

          def infer_return_type_deep(func_node, module_tree=None):
              """Deep inference of return types including nested structures"""
              return_types = set()
              
              for node in ast.walk(func_node):
                  if isinstance(node, ast.Return) and node.value:
                      ret_type = analyze_expr_type(node.value)
                      return_types.add(ret_type)
              
              # If multiple return types, mark as mixed
              if len(return_types) > 1:
                  return f"Mixed[{','.join(sorted(return_types))}]"
              return return_types.pop() if return_types else "None"

          def analyze_expr_type(expr):
              """Analyze expression to determine its type"""
              if isinstance(expr, ast.Constant):
                  return type(expr.value).__name__
              elif isinstance(expr, ast.List):
                  if expr.elts:
                      elem_types = {analyze_expr_type(e) for e in expr.elts}
                      if len(elem_types) == 1:
                          return f"List[{elem_types.pop()}]"
                      return "List[Mixed]"
                  return "List"
              elif isinstance(expr, ast.Dict):
                  return "Dict"
              elif isinstance(expr, ast.Tuple):
                  return "Tuple"
              elif isinstance(expr, ast.Set):
                  return "Set"
              elif isinstance(expr, ast.Call):
                  # Try to get function name
                  if isinstance(expr.func, ast.Name):
                      return f"ReturnOf[{expr.func.id}]"
                  elif isinstance(expr.func, ast.Attribute):
                      return f"ReturnOf[{expr.func.attr}]"
                  return "Unknown"
              elif isinstance(expr, ast.BinOp):
                  # Binary operations - infer from operands
                  left_type = analyze_expr_type(expr.left)
                  right_type = analyze_expr_type(expr.right)
                  if "str" in [left_type, right_type]:
                      return "str"
                  if "float" in [left_type, right_type]:
                      return "float"
                  return "int"
              elif isinstance(expr, ast.Name):
                  return f"Variable[{expr.id}]"
              return "Unknown"

          def find_operations_on_variable(func_node, var_name):
              """Find what operations are performed on a variable"""
              operations = []
              
              for node in ast.walk(func_node):
                  if isinstance(node, ast.BinOp):
                      left_name = None
                      right_name = None
                      
                      if isinstance(node.left, ast.Name):
                          left_name = node.left.id
                      if isinstance(node.right, ast.Name):
                          right_name = node.right.id
                      
                      if left_name == var_name or right_name == var_name:
                          op_type = type(node.op).__name__
                          operations.append({
                              "operation": op_type,
                              "line": node.lineno,
                              "expects": "numeric" if op_type in ["Add", "Sub", "Mult", "Div", "Mod"] else "any"
                          })
              
              return operations

          def analyze_function_calls_and_usage(directory):
              """Analyze how function return values are used"""
              function_info = {}
              call_usage = defaultdict(list)
              
              # First pass: collect all function signatures and return types
              for root, _, files in os.walk(directory):
                  for f in files:
                      if f.endswith(".py"):
                          path = os.path.join(root, f)
                          rel_path = os.path.relpath(path, directory)
                          
                          with open(path, "r", encoding="utf-8") as file:
                              try:
                                  content = file.read()
                                  tree = ast.parse(content, filename=f)
                              except SyntaxError:
                                  continue
                              
                              # Collect function definitions
                              for node in ast.walk(tree):
                                  if isinstance(node, ast.FunctionDef):
                                      return_type = infer_return_type_deep(node, tree)
                                      
                                      function_info[node.name] = {
                                          "file": rel_path,
                                          "line": node.lineno,
                                          "returns": return_type,
                                          "annotated_return": ast.unparse(node.returns) if node.returns else None
                                      }
              
              # Second pass: find how return values are used
              for root, _, files in os.walk(directory):
                  for f in files:
                      if f.endswith(".py"):
                          path = os.path.join(root, f)
                          rel_path = os.path.relpath(path, directory)
                          
                          with open(path, "r", encoding="utf-8") as file:
                              try:
                                  tree = ast.parse(file.read(), filename=f)
                              except SyntaxError:
                                  continue
                              
                              # Analyze assignments from function calls
                              for node in ast.walk(tree):
                                  if isinstance(node, ast.Assign):
                                      # Check if assigning from a function call
                                      if isinstance(node.value, ast.Call):
                                          func_name = None
                                          if isinstance(node.value.func, ast.Name):
                                              func_name = node.value.func.id
                                          elif isinstance(node.value.func, ast.Attribute):
                                              func_name = node.value.func.attr
                                          
                                          if func_name and func_name in function_info:
                                              # Check what's done with the variable
                                              for target in node.targets:
                                                  if isinstance(target, ast.Name):
                                                      var_name = target.id
                                                      
                                                      # Find parent function
                                                      parent_func = None
                                                      for pnode in ast.walk(tree):
                                                          if isinstance(pnode, ast.FunctionDef):
                                                              if node.lineno >= pnode.lineno:
                                                                  parent_func = pnode
                                                      
                                                      if parent_func:
                                                          ops = find_operations_on_variable(parent_func, var_name)
                                                          
                                                          for op in ops:
                                                              call_usage[func_name].append({
                                                                  "called_in_file": rel_path,
                                                                  "called_in_func": parent_func.name,
                                                                  "call_line": node.lineno,
                                                                  "usage_line": op["line"],
                                                                  "operation": op["operation"],
                                                                  "expects": op["expects"]
                                                              })
              
              return function_info, call_usage

          def check_type_compatibility(function_info, call_usage):
              """Check if return types match expected usage"""
              errors = []
              warnings = []
              
              for func_name, usages in call_usage.items():
                  if func_name not in function_info:
                      continue
                  
                  func_data = function_info[func_name]
                  return_type = func_data["returns"]
                  
                  for usage in usages:
                      expected = usage["expects"]
                      
                      # Check type compatibility
                      if expected == "numeric":
                          if "str" in return_type.lower():
                              errors.append({
                                  "severity": "ERROR",
                                  "function": func_name,
                                  "defined_in": func_data["file"],
                                  "returns": return_type,
                                  "called_in": usage["called_in_file"],
                                  "caller_func": usage["called_in_func"],
                                  "call_line": usage["call_line"],
                                  "problem_line": usage["usage_line"],
                                  "operation": usage["operation"],
                                  "issue": f"Function returns '{return_type}' but used in numeric operation '{usage['operation']}'"
                              })
                          elif "List" in return_type or "Dict" in return_type or "Tuple" in return_type:
                              warnings.append({
                                  "severity": "WARNING",
                                  "function": func_name,
                                  "defined_in": func_data["file"],
                                  "returns": return_type,
                                  "called_in": usage["called_in_file"],
                                  "caller_func": usage["caller_in_func"],
                                  "call_line": usage["call_line"],
                                  "problem_line": usage["usage_line"],
                                  "operation": usage["operation"],
                                  "issue": f"Function returns '{return_type}' used in numeric operation - may cause TypeError"
                              })
              
              return errors, warnings

          # Run analysis
          print("=" * 70)
          print("🔬 ANALYZING TYPE COMPATIBILITY ACROSS FUNCTIONS")
          print("=" * 70)
          
          function_info, call_usage = analyze_function_calls_and_usage(".")
          errors, warnings = check_type_compatibility(function_info, call_usage)
          
          if errors:
              print("\n❌ TYPE MISMATCH ERRORS DETECTED:")
              print("=" * 70)
              for err in errors:
                  print(f"\n🚨 {err['severity']}: Type mismatch in function usage")
                  print(f"   Function: {err['function']}()")
                  print(f"   Defined in: {err['defined_in']}")
                  print(f"   Returns: {err['returns']}")
                  print(f"   ⚠️  Called in: {err['called_in']} (line {err['call_line']})")
                  print(f"   ⚠️  Used in: {err['caller_func']}() at line {err['problem_line']}")
                  print(f"   ⚠️  Operation: {err['operation']}")
                  print(f"   ❌ {err['issue']}")
              
              print("\n" + "=" * 70)
              print("🛠️  FIX REQUIRED:")
              print("   • Change return type to numeric (int/float)")
              print("   • OR convert return value before use: int(result), float(result)")
              print("   • OR add type annotations to catch this earlier")
              print("=" * 70)
              sys.exit(1)
          
          if warnings:
              print("\n⚠️  TYPE COMPATIBILITY WARNINGS:")
              for warn in warnings:
                  print(f"   • {warn['function']}() in {warn['defined_in']} returns {warn['returns']}")
                  print(f"     Used in numeric operation at {warn['called_in']}:{warn['problem_line']}")
          
          if not errors and not warnings:
              print("\n✅ All function calls are type-compatible!")
          
          print("=" * 70)
          EOF

      # --- FUNCTION DEPENDENCY IMPACT CHECK ---
      - name: Analyze function dependency and behavioral impact
        run: |
          echo "🧩 Checking for function dependency impact..."
          python <<'EOF'
          import ast, os, sys, json
          from collections import defaultdict

          def get_function_signatures(directory):
              signatures = {}
              for root, _, files in os.walk(directory):
                  for f in files:
                      if f.endswith(".py"):
                          path = os.path.join(root, f)
                          rel_path = os.path.relpath(path, directory)
                          with open(path, "r", encoding="utf-8") as file:
                              try:
                                  content = file.read()
                                  tree = ast.parse(content, filename=f)
                              except SyntaxError:
                                  continue
                              
                              for node in ast.walk(tree):
                                  if isinstance(node, ast.FunctionDef):
                                      returns = ast.unparse(node.returns) if getattr(node, "returns", None) else ""
                                      
                                      if not returns:
                                          returns = infer_return_type(node)
                                      
                                      signatures[f"{rel_path}:{node.name}"] = {
                                          "args": [a.arg for a in node.args.args],
                                          "defaults": len(node.args.defaults),
                                          "returns": returns,
                                          "file": rel_path,
                                          "line": node.lineno,
                                      }
              return signatures

          def infer_return_type(func_node):
              for node in ast.walk(func_node):
                  if isinstance(node, ast.Return) and node.value:
                      if isinstance(node.value, ast.List):
                          return "List"
                      elif isinstance(node.value, ast.Dict):
                          return "Dict"
                      elif isinstance(node.value, ast.Tuple):
                          return "Tuple"
                      elif isinstance(node.value, ast.Constant):
                          return type(node.value.value).__name__
                      elif isinstance(node.value, ast.Call):
                          if isinstance(node.value.func, ast.Name):
                              if node.value.func.id in ["str", "int", "float", "list", "dict"]:
                                  return node.value.func.id
                          return "Unknown"
              return "None"

          def find_function_calls(directory):
              calls = defaultdict(list)
              for root, _, files in os.walk(directory):
                  for f in files:
                      if f.endswith(".py"):
                          path = os.path.join(root, f)
                          rel_path = os.path.relpath(path, directory)
                          with open(path, "r", encoding="utf-8") as file:
                              try:
                                  tree = ast.parse(file.read(), filename=f)
                              except SyntaxError:
                                  continue
                              
                              for node in ast.walk(tree):
                                  if isinstance(node, ast.Call):
                                      if isinstance(node.func, ast.Name):
                                          func_name = node.func.id
                                          calls[func_name].append({
                                              "file": rel_path,
                                              "line": node.lineno
                                          })
                                      elif isinstance(node.func, ast.Attribute):
                                          func_name = node.func.attr
                                          calls[func_name].append({
                                              "file": rel_path,
                                              "line": node.lineno
                                          })
              return calls

          SNAPSHOT_FILE = ".code_signatures_snapshot.json"

          old_signatures = {}
          if os.path.exists(SNAPSHOT_FILE):
              try:
                  with open(SNAPSHOT_FILE) as f:
                      old_signatures = json.load(f)
              except Exception:
                  old_signatures = {}

          new_signatures = get_function_signatures(".")
          function_calls = find_function_calls(".")

          impacted = []
          breaking_changes = []
          
          for func_path, info in new_signatures.items():
              func_name = func_path.split(":")[-1]
              
              if func_path in old_signatures:
                  old_info = old_signatures[func_path]
                  changes = []
                  
                  if old_info["args"] != info["args"]:
                      if len(old_info["args"]) != len(info["args"]):
                          changes.append(f"parameter count changed: {len(old_info['args'])} → {len(info['args'])}")
                          breaking_changes.append((func_path, "parameter_count", func_name))
                      else:
                          changes.append(f"parameter names changed: {old_info['args']} → {info['args']}")
                  
                  if old_info["returns"] != info["returns"]:
                      old_ret = old_info["returns"] or "None"
                      new_ret = info["returns"] or "None"
                      changes.append(f"return type changed: {old_ret} → {new_ret}")
                      breaking_changes.append((func_path, "return_type", func_name))
                  
                  if old_info.get("defaults", 0) != info.get("defaults", 0):
                      changes.append(f"default arguments changed")
                  
                  if changes:
                      call_locations = function_calls.get(func_name, [])
                      
                      impact_msg = f"\n📍 {func_path} (line {info['line']})"
                      for change in changes:
                          impact_msg += f"\n   ⚠️  {change}"
                      
                      if call_locations:
                          cross_file_calls = [loc for loc in call_locations if loc["file"] != info["file"]]
                          if cross_file_calls:
                              impact_msg += f"\n   🔗 Called in {len(cross_file_calls)} other file(s):"
                              for loc in cross_file_calls[:5]:
                                  impact_msg += f"\n      • {loc['file']}:{loc['line']}"
                              if len(cross_file_calls) > 5:
                                  impact_msg += f"\n      • ... and {len(cross_file_calls) - 5} more"
                      
                      impacted.append(impact_msg)

          with open(SNAPSHOT_FILE, "w") as f:
              json.dump(new_signatures, f, indent=2)

          if impacted:
              print("🚨 FUNCTION BEHAVIOR CHANGES DETECTED")
              print("=" * 60)
              for impact in impacted:
                  print(impact)
              
              if breaking_changes:
                  print("\n" + "=" * 60)
                  print("⛔ BREAKING CHANGES:")
                  for func_path, change_type, func_name in breaking_changes:
                      print(f"   • {func_path} - {change_type}")
                  
              print("\n" + "=" * 60)
              print("📋 ACTION REQUIRED:")
              print("   1. Review all affected function calls")
              print("   2. Update calling code if necessary")
              print("   3. Add tests for changed functions")
              print("=" * 60)
              sys.exit(1)
          else:
              print("✅ No function signature changes detected.")
          EOF

      # --- CODE DUPLICATION CHECK ---
      - name: Check for code duplication
        run: |
          echo "🔄 Checking for duplicate code..."
          python <<'EOF'
          import ast, os, hashlib
          from collections import defaultdict

          blocks = defaultdict(list)
          for root, _, files in os.walk("."):
              for f in files:
                  if f.endswith(".py"):
                      path = os.path.join(root, f)
                      with open(path, "r", encoding="utf-8") as file:
                          try:
                              tree = ast.parse(file.read())
                          except SyntaxError:
                              continue
                          
                          for node in ast.walk(tree):
                              if isinstance(node, (ast.FunctionDef, ast.ClassDef)):
                                  code = ast.unparse(node)
                                  if len(code) > 100:
                                      code_hash = hashlib.md5(code.encode()).hexdigest()
                                      blocks[code_hash].append(f"{path}:{node.name}")

          duplicates = {k: v for k, v in blocks.items() if len(v) > 1}
          if duplicates:
              print("⚠️  Duplicate code found:")
              for locs in duplicates.values():
                  print(f"   • {', '.join(locs)}")
          else:
              print("✅ No code duplication detected.")
          EOF

      # --- SECURITY CHECK ---
      - name: Security vulnerability scan
        continue-on-error: true
        run: |
          echo "🔒 Running security scan..."
          bandit -r . -f custom -o /dev/null || true
          python <<'EOF'
          import re, os

          PATTERNS = {
              r'eval\(': 'eval() usage',
              r'exec\(': 'exec() usage',
              r'shell=True': 'shell=True in subprocess',
              r'password\s*=\s*["\'][^"\']+["\']': 'Hardcoded password',
          }

          issues = []
          for root, _, files in os.walk("."):
              for f in files:
                  if f.endswith(".py"):
                      path = os.path.join(root, f)
                      with open(path, "r") as file:
                          for i, line in enumerate(file, 1):
                              for pattern, desc in PATTERNS.items():
                                  if re.search(pattern, line, re.IGNORECASE):
                                      issues.append(f"{path}:{i} - {desc}")

          if issues:
              print("⚠️  Security patterns found:")
              for issue in issues:
                  print(f"   • {issue}")
          else:
              print("✅ No security issues detected.")
          EOF

      # --- SUMMARY ---
      - name: Generate check summary
        if: always()
        run: |
          echo "# 📊 Code Quality Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All quality checks completed. Review logs for details." >> $GITHUB_STEP_SUMMARY