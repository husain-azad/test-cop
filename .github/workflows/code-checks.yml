name: Code Quality Checks

on:
  push:
    branches: [dev_*, feat/*]

jobs:
  code-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9.20'

      - name: Install dependencies for checks
        run: |
          python -m pip install --upgrade pip
          pip install mypy

      - name: Identify changed Python files
        id: changed-files
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep '\.py$' || true)
          echo "Changed Python files:"
          echo "$CHANGED_FILES"

          {
            echo "files<<EOF"
            echo "$CHANGED_FILES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Run Syntax and Type Checks (only if files changed)
        if: steps.changed-files.outputs.files != ''
        run: |
          echo "Checking changed Python files..."
          EXIT_CODE=0

          for file in ${{ steps.changed-files.outputs.files }}; do
            if [ -n "$file" ]; then
              echo "🔍 Running checks on: $file"

              # Syntax check
              if ! python -m py_compile "$file"; then
                echo "❌ Syntax check failed for $file"
                EXIT_CODE=1
              fi

              # Type check
              if ! mypy --follow-imports=skip --ignore-missing-imports "$file"; then
                echo "❌ Type check failed for $file"
                EXIT_CODE=1
              fi
            fi
          done

          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ One or more checks failed."
            exit 1
          else
            echo "✅ All checks passed successfully."
          fi

      - name: Skip Check (no Python files changed)
        if: steps.changed-files.outputs.files == ''
        run: echo "No Python files changed. Skipping checks."


