name: Code Quality Checks
on:
  push:
    branches:
      - dev_*
      - feat/*
permissions:
  contents: write
  pull-requests: write
jobs:
  code-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9.20'
      
      - name: Install analysis tools and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            mypy==1.7.1 \
            vulture==2.10
      
      # ==============================================================
      # IDENTIFY CHANGED PYTHON FILES
      # ==============================================================
      - name: Get changed Python files
        id: changed_files
        run: |
          echo "Checking changed Python files..."
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep '\.py$' || true)
          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      # ==============================================================
      # FOCUSED ANALYSIS ON CHANGED FILES
      # ==============================================================
      - name: Run focused checks on changed files
        id: quality_checks
        if: steps.changed_files.outputs.files != ''
        run: |
          set -e  # Exit immediately if any command fails
          echo "Running focused checks on changed Python files..."
          HAS_ERRORS=0
          
          while IFS= read -r file; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              echo ""
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "🔍 Analyzing: $file"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              
              # 1. TYPE CHECKING (Mypy) - Critical for type errors
              echo ""
              echo "🔷 TYPE CHECKING (mypy)"
              echo "----------------------------------------"
              if ! mypy --ignore-missing-imports --show-error-codes --pretty "$file"; then
                echo "❌ Type errors detected"
                HAS_ERRORS=1
              else
                echo "✅ No type errors found"
              fi
              
              # 2. DEAD CODE DETECTION (Vulture)
              echo ""
              echo "💀 DEAD CODE DETECTION (vulture)"
              echo "----------------------------------------"
              VULTURE_OUTPUT=$(vulture "$file" --min-confidence 80 2>&1 || true)
              if [ -z "$VULTURE_OUTPUT" ]; then
                echo "✅ No dead code found"
              else
                echo "$VULTURE_OUTPUT"
                echo "⚠️  Potential dead code detected (review recommended)"
              fi
              
              
              echo ""
            fi
          done <<< "${{ steps.changed_files.outputs.files }}"
          
          if [ $HAS_ERRORS -eq 1 ]; then
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "❌ CODE QUALITY CHECKS FAILED!"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          else
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "✅ ALL CHECKS PASSED!"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          fi
      
      - name: Skip check (no Python file changed)
        if: steps.changed_files.outputs.files == ''
        run: echo "✅ No Python files changed, skipping checks."
      
      # ==============================================================
      # GENERATE DETAILED GITHUB SUMMARY
      # ==============================================================
      - name: Generate GitHub Summary
        if: always()
        run: |
          echo "# 📊 Focused Code Quality Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Focus Areas:** Type Checking • Undefined Names • Import Errors • Dead Code" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## 📋 Build Information" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Author | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## 🎯 Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.changed_files.outputs.files }}" == "" ]; then
            echo "ℹ️ **No Python files changed** - No checks required." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.quality_checks.outcome }}" == "success" ]; then
            echo "✅ **All checks passed!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ No type errors" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ No undefined names or imports" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ No variables used before assignment" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ No significant dead code" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Issues detected** - Please review the logs above." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Common Issues to Check:" >> $GITHUB_STEP_SUMMARY
            echo "- 🔍 Type annotations and type compatibility" >> $GITHUB_STEP_SUMMARY
            echo "- 🔍 Import statements and module availability" >> $GITHUB_STEP_SUMMARY
            echo "- 🔍 Variable definitions before usage" >> $GITHUB_STEP_SUMMARY
            echo "- 🔍 Unused imports and variables" >> $GITHUB_STEP_SUMMARY
            echo "- 🔍 Dead/unreachable code" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*View detailed logs in the workflow run above* ⬆️" >> $GITHUB_STEP_SUMMARY