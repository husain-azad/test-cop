name: Code Quality Checks

on:
  push:
    branches:
      - dev_*
      - feat/*

jobs:
  code-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9.20'

      - name: Install dependencies for checks
        run: |
          python -m pip install --upgrade pip
          pip install mypy flake8 radon pylint astroid

      # --- SYNTAX CHECK ---
      - name: Check for syntax errors
        run: |
          echo "🔍 Checking for syntax errors..."
          python -m compileall -q .

      # --- TYPE & SEMANTIC CHECK ---
      - name: Run MyPy (detect import/type/semantic issues)
        run: |
          echo "🧠 Running MyPy static analysis..."
          mypy --ignore-missing-imports .

      # --- LINT CHECK (STYLE & BASIC ERRORS) ---
      - name: Run flake8 (code style & lint)
        run: |
          echo "🎨 Running flake8 linting..."
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # --- CODE COMPLEXITY CHECK ---
      - name: Analyze code complexity (Radon)
        run: |
          echo "⚙️ Checking for code complexity..."
          radon cc . -a -nc

      # --- FUNCTION DEPENDENCY IMPACT CHECK ---
      - name: Analyze function dependency and behavioral impact
        run: |
          echo "🧩 Checking for function dependency impact..."
          python <<'EOF'
          import ast, os, sys, json

          def get_function_signatures(directory):
              signatures = {}
              for root, _, files in os.walk(directory):
                  for f in files:
                      if f.endswith(".py"):
                          path = os.path.join(root, f)
                          with open(path, "r", encoding="utf-8") as file:
                              try:
                                  tree = ast.parse(file.read(), filename=f)
                              except SyntaxError:
                                  continue
                              for node in ast.walk(tree):
                                  if isinstance(node, ast.FunctionDef):
                                      # Collect args and return type (if annotation exists)
                                      returns = ast.unparse(node.returns) if getattr(node, "returns", None) else ""
                                      signatures[f"{f}:{node.name}"] = {
                                          "args": [a.arg for a in node.args.args],
                                          "returns": returns,
                                          "file": f,
                                      }
              return signatures

          SNAPSHOT_FILE = ".code_signatures_snapshot.json"

          old_signatures = {}
          if os.path.exists(SNAPSHOT_FILE):
              try:
                  old_signatures = json.load(open(SNAPSHOT_FILE))
              except Exception:
                  old_signatures = {}

          new_signatures = get_function_signatures(".")

          impacted = []
          for func, info in new_signatures.items():
              if func in old_signatures:
                  old_info = old_signatures[func]
                  if old_info["args"] != info["args"]:
                      impacted.append(f"{func} — function parameters changed")
                  elif old_info["returns"] != info["returns"]:
                      impacted.append(f"{func} — return type changed")

          with open(SNAPSHOT_FILE, "w") as f:
              json.dump(new_signatures, f, indent=2)

          if impacted:
              print("🚨 Potentially impacted functions detected:\n")
              for i in impacted:
                  print(f" - {i}")
              print("\n❗ Please review dependent files before merge.")
              sys.exit(1)
          else:
              print("✅ No function behavior changes detected.")
          EOF
