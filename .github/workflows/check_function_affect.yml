name: Code Quality Checks

on:
  push:
    branches:
      - dev_*
      - feat/*

permissions:
  contents: write
  pull-requests: write

jobs:
  code-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9.20'
          cache: 'pip'

      - name: Install analysis tools and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            mypy==1.7.1 \
            pytype==2023.11.21 \
            pylint==3.0.3 \
            flake8==6.1.0 \
            flake8-bugbear==23.12.2 \
            flake8-comprehensions==3.14.0 \
            radon==6.0.1 \
            bandit==1.7.5 \
            safety==2.3.5 \
            vulture==2.10 \
            pydocstyle==6.3.0 \
            pyflakes==3.1.0 \
            pycodestyle==2.11.1 \
            mccabe==0.7.0 \
            astroid==3.0.2 \
            jedi==0.19.1 \
            autopep8==2.0.4 \
            isort==5.13.2

      # ============================================================================
      # COMPREHENSIVE CODE QUALITY CHECK USING PROFESSIONAL TOOLS
      # ============================================================================
      
      - name: Run Comprehensive Code Quality Analysis
        id: quality_checks
        run: |
          echo "🔍 Starting comprehensive code quality analysis with professional tools..."
          python <<'EOF'
          import subprocess
          import sys
          import json
          import os
          from collections import defaultdict
          from pathlib import Path

          class EnhancedErrorCollector:
              def __init__(self):
                  self.errors = defaultdict(list)
                  self.warnings = defaultdict(list)
                  self.info = []
                  
              def add_error(self, category, message, file=None, line=None, details=None):
                  self.errors[category].append({
                      "message": message,
                      "file": file,
                      "line": line,
                      "details": details or {}
                  })
              
              def add_warning(self, category, message, file=None, line=None, details=None):
                  self.warnings[category].append({
                      "message": message,
                      "file": file,
                      "line": line,
                      "details": details or {}
                  })
              
              def add_info(self, message):
                  self.info.append(message)
              
              def has_errors(self):
                  return len(self.errors) > 0
              
              def print_report(self):
                  print("\n" + "=" * 90)
                  print("📊 COMPREHENSIVE CODE QUALITY REPORT (POWERED BY INDUSTRY-STANDARD TOOLS)")
                  print("=" * 90)
                  
                  if self.errors:
                      total_errors = sum(len(errs) for errs in self.errors.values())
                      print(f"\n❌ CRITICAL ERRORS FOUND: {total_errors}")
                      print("=" * 90)
                      
                      for category, errs in sorted(self.errors.items()):
                          print(f"\n🔴 {category.upper().replace('_', ' ')} ({len(errs)} issue(s)):")
                          print("-" * 90)
                          for i, err in enumerate(errs, 1):
                              print(f"\n  {i}. {err['message']}")
                              if err['file']:
                                  location = f"{err['file']}"
                                  if err['line']:
                                      location += f":{err['line']}"
                                  print(f"     📁 Location: {location}")
                              if err['details']:
                                  for key, value in err['details'].items():
                                      print(f"     ℹ️  {key}: {value}")
                  
                  if self.warnings:
                      total_warnings = sum(len(warns) for warns in self.warnings.values())
                      print(f"\n⚠️  WARNINGS FOUND: {total_warnings}")
                      print("=" * 90)
                      
                      for category, warns in sorted(self.warnings.items()):
                          print(f"\n🟡 {category.upper().replace('_', ' ')} ({len(warns)} issue(s)):")
                          print("-" * 90)
                          display_count = min(10, len(warns))
                          for i, warn in enumerate(warns[:display_count], 1):
                              print(f"  {i}. {warn['message']}")
                              if warn['file']:
                                  location = f"{warn['file']}"
                                  if warn['line']:
                                      location += f":{warn['line']}"
                                  print(f"     📁 {location}")
                          if len(warns) > 10:
                              print(f"\n  ... and {len(warns) - 10} more {category} warnings")
                  
                  if self.info:
                      print(f"\n✅ PASSED CHECKS: {len(self.info)}")
                      for inf in self.info:
                          print(f"  ✓ {inf}")
                  
                  print("\n" + "=" * 90)
                  if self.errors:
                      print("❌ BUILD FAILED - Please fix all critical errors above")
                      print("=" * 90)
                      print("\n💡 TIPS:")
                      print("  • All errors are shown at once - fix them all in one commit")
                      print("  • Check the tool-specific documentation for detailed fixes")
                      print("  • Run tools locally: mypy, pylint, bandit, etc.")
                  else:
                      print("✅ ALL CRITICAL CHECKS PASSED")
                      print("=" * 90)

          collector = EnhancedErrorCollector()

          def run_command(cmd, description):
              """Run a command and return output"""
              print(f"\n🔧 {description}...")
              try:
                  result = subprocess.run(
                      cmd,
                      shell=True,
                      capture_output=True,
                      text=True,
                      timeout=300
                  )
                  return result.returncode, result.stdout, result.stderr
              except subprocess.TimeoutExpired:
                  return -1, "", "Command timed out"
              except Exception as e:
                  return -1, "", str(e)

          # ============================================================================
          # 1. MYPY - Advanced Static Type Checking
          # ============================================================================
          def check_mypy(collector):
              print("=" * 90)
              print("🔍 RUNNING MYPY - Static Type Checker")
              print("=" * 90)
              
              code, stdout, stderr = run_command(
                  'mypy --ignore-missing-imports --show-error-codes --no-error-summary '
                  '--warn-redundant-casts --warn-unused-ignores --warn-return-any '
                  '--strict-equality --disallow-untyped-calls . 2>&1',
                  "MyPy static type analysis"
              )
              
              output = stdout + stderr
              if "error:" in output.lower():
                  for line in output.split('\n'):
                      if 'error:' in line.lower():
                          parts = line.split(':', 3)
                          if len(parts) >= 4:
                              file_path = parts[0].strip()
                              try:
                                  line_num = int(parts[1].strip())
                              except:
                                  line_num = None
                              error_msg = parts[3].strip() if len(parts) > 3 else parts[2].strip()
                              
                              # Detect type mismatches
                              if 'incompatible' in error_msg.lower() or 'type' in error_msg.lower():
                                  collector.add_error(
                                      "type_error",
                                      error_msg,
                                      file=file_path,
                                      line=line_num,
                                      details={"Tool": "MyPy", "Fix": "Add type hints or fix type incompatibility"}
                                  )
                              else:
                                  collector.add_warning(
                                      "mypy_warning",
                                      error_msg,
                                      file=file_path,
                                      line=line_num
                                  )
              else:
                  collector.add_info("MyPy: No type errors detected")

          # ============================================================================
          # 2. PYLINT - Comprehensive Code Analysis
          # ============================================================================
          def check_pylint(collector):
              print("=" * 90)
              print("🔍 RUNNING PYLINT - Code Quality Analyzer")
              print("=" * 90)
              
              code, stdout, stderr = run_command(
                  'pylint --output-format=json --disable=C0114,C0115,C0116 '
                  '--max-line-length=120 --fail-under=7.0 . 2>&1 || true',
                  "PyLint comprehensive analysis"
              )
              
              try:
                  output = stdout + stderr
                  # Try to parse JSON output
                  for line in output.split('\n'):
                      if line.strip().startswith('['):
                          try:
                              results = json.loads(line)
                              for issue in results:
                                  msg_type = issue.get('type', 'unknown')
                                  message = issue.get('message', '')
                                  path = issue.get('path', '')
                                  line_num = issue.get('line', None)
                                  symbol = issue.get('symbol', '')
                                  
                                  if msg_type in ['error', 'fatal']:
                                      collector.add_error(
                                          "pylint_error",
                                          f"{message} [{symbol}]",
                                          file=path,
                                          line=line_num,
                                          details={"Tool": "PyLint", "Severity": msg_type}
                                      )
                                  elif msg_type == 'warning':
                                      collector.add_warning(
                                          "code_quality",
                                          f"{message} [{symbol}]",
                                          file=path,
                                          line=line_num
                                      )
                          except json.JSONDecodeError:
                              continue
              except Exception as e:
                  print(f"⚠️  PyLint analysis completed with parsing issues: {e}")
              
              collector.add_info("PyLint: Code quality analysis completed")

          # ============================================================================
          # 3. BANDIT - Security Vulnerability Scanner
          # ============================================================================
          def check_bandit(collector):
              print("=" * 90)
              print("🔍 RUNNING BANDIT - Security Scanner")
              print("=" * 90)
              
              code, stdout, stderr = run_command(
                  'bandit -r . -f json --skip B101 2>&1 || true',
                  "Bandit security vulnerability scan"
              )
              
              try:
                  output = stdout + stderr
                  for line in output.split('\n'):
                      if line.strip().startswith('{'):
                          try:
                              results = json.loads(line)
                              issues = results.get('results', [])
                              
                              for issue in issues:
                                  severity = issue.get('issue_severity', 'MEDIUM')
                                  confidence = issue.get('issue_confidence', 'MEDIUM')
                                  text = issue.get('issue_text', '')
                                  filename = issue.get('filename', '')
                                  line_num = issue.get('line_number', None)
                                  
                                  if severity in ['HIGH', 'CRITICAL']:
                                      collector.add_error(
                                          "security_vulnerability",
                                          text,
                                          file=filename,
                                          line=line_num,
                                          details={
                                              "Severity": severity,
                                              "Confidence": confidence,
                                              "Tool": "Bandit"
                                          }
                                      )
                                  elif severity == 'MEDIUM':
                                      collector.add_warning(
                                          "security",
                                          text,
                                          file=filename,
                                          line=line_num
                                      )
                          except json.JSONDecodeError:
                              continue
              except Exception as e:
                  print(f"⚠️  Bandit analysis completed: {e}")
              
              collector.add_info("Bandit: Security scan completed")

          # ============================================================================
          # 4. FLAKE8 - Style Guide Enforcement + Bug Detection
          # ============================================================================
          def check_flake8(collector):
              print("=" * 90)
              print("🔍 RUNNING FLAKE8 - Style and Bug Checker")
              print("=" * 90)
              
              code, stdout, stderr = run_command(
                  'flake8 --extend-ignore=E203,W503 --max-line-length=120 '
                  '--count --statistics . 2>&1',
                  "Flake8 style and bug detection"
              )
              
              output = stdout + stderr
              for line in output.split('\n'):
                  if ':' in line and any(x in line for x in ['E', 'F', 'W', 'C', 'B']):
                      parts = line.split(':', 3)
                      if len(parts) >= 4:
                          file_path = parts[0].strip()
                          try:
                              line_num = int(parts[1].strip())
                          except:
                              line_num = None
                          error_code = parts[3].split()[0] if len(parts[3].split()) > 0 else ''
                          message = parts[3].strip()
                          
                          # F errors are typically bugs
                          if error_code.startswith('F'):
                              collector.add_error(
                                  "code_error",
                                  message,
                                  file=file_path,
                                  line=line_num,
                                  details={"Tool": "Flake8", "Code": error_code}
                              )
                          elif error_code.startswith('E9'):
                              collector.add_error(
                                  "syntax_error",
                                  message,
                                  file=file_path,
                                  line=line_num,
                                  details={"Tool": "Flake8"}
                              )
                          else:
                              collector.add_warning(
                                  "style_issue",
                                  message,
                                  file=file_path,
                                  line=line_num
                              )
              
              if not any('E' in line or 'F' in line for line in output.split('\n')):
                  collector.add_info("Flake8: No style or bug issues detected")

          # ============================================================================
          # 5. RADON - Code Complexity Metrics
          # ============================================================================
          def check_radon(collector):
              print("=" * 90)
              print("🔍 RUNNING RADON - Complexity Analyzer")
              print("=" * 90)
              
              code, stdout, stderr = run_command(
                  'radon cc . -j 2>&1',
                  "Radon complexity analysis"
              )
              
              try:
                  output = stdout + stderr
                  for line in output.split('\n'):
                      if line.strip().startswith('{'):
                          try:
                              results = json.loads(line)
                              for file_path, functions in results.items():
                                  for func in functions:
                                      complexity = func.get('complexity', 0)
                                      name = func.get('name', '')
                                      lineno = func.get('lineno', None)
                                      
                                      if complexity > 15:
                                          collector.add_error(
                                              "high_complexity",
                                              f"Function '{name}' has very high complexity ({complexity})",
                                              file=file_path,
                                              line=lineno,
                                              details={
                                                  "Complexity": complexity,
                                                  "Threshold": 15,
                                                  "Fix": "Break down into smaller functions"
                                              }
                                          )
                                      elif complexity > 10:
                                          collector.add_warning(
                                              "complexity",
                                              f"Function '{name}' has high complexity ({complexity})",
                                              file=file_path,
                                              line=lineno
                                          )
                          except json.JSONDecodeError:
                              continue
              except Exception as e:
                  print(f"⚠️  Radon analysis completed: {e}")
              
              collector.add_info("Radon: Complexity analysis completed")

          # ============================================================================
          # 6. VULTURE - Dead Code Detection
          # ============================================================================
          def check_vulture(collector):
              print("=" * 90)
              print("🔍 RUNNING VULTURE - Dead Code Detector")
              print("=" * 90)
              
              code, stdout, stderr = run_command(
                  'vulture . --min-confidence 80 2>&1',
                  "Vulture dead code detection"
              )
              
              output = stdout + stderr
              dead_code_count = 0
              for line in output.split('\n'):
                  if 'unused' in line.lower():
                      parts = line.split(':', 2)
                      if len(parts) >= 2:
                          file_path = parts[0].strip()
                          message = parts[-1].strip() if len(parts) > 2 else line
                          try:
                              line_num = int(parts[1].strip().split()[0])
                          except:
                              line_num = None
                          
                          collector.add_warning(
                              "dead_code",
                              message,
                              file=file_path,
                              line=line_num
                          )
                          dead_code_count += 1
              
              if dead_code_count == 0:
                  collector.add_info("Vulture: No dead code detected")

          # ============================================================================
          # 7. SAFETY - Dependency Vulnerability Check
          # ============================================================================
          def check_safety(collector):
              print("=" * 90)
              print("🔍 RUNNING SAFETY - Dependency Vulnerability Checker")
              print("=" * 90)
              
              # Check if requirements.txt exists
              if not os.path.exists('requirements.txt'):
                  collector.add_info("Safety: No requirements.txt found, skipping dependency check")
                  return
              
              code, stdout, stderr = run_command(
                  'safety check --json --file requirements.txt 2>&1 || true',
                  "Safety dependency vulnerability check"
              )
              
              try:
                  output = stdout + stderr
                  for line in output.split('\n'):
                      if line.strip().startswith('['):
                          try:
                              results = json.loads(line)
                              for vuln in results:
                                  package = vuln.get('package', '')
                                  version = vuln.get('installed_version', '')
                                  vuln_desc = vuln.get('vulnerability', '')
                                  
                                  collector.add_error(
                                      "dependency_vulnerability",
                                      f"Vulnerable dependency: {package} {version}",
                                      details={
                                          "Vulnerability": vuln_desc,
                                          "Tool": "Safety",
                                          "Fix": "Update to secure version"
                                      }
                                  )
                          except json.JSONDecodeError:
                              continue
              except Exception as e:
                  print(f"⚠️  Safety check completed: {e}")
              
              collector.add_info("Safety: Dependency security check completed")

          # ============================================================================
          # 8. CUSTOM TYPE COMPATIBILITY CHECK (Your Main Requirement)
          # ============================================================================
          def check_custom_type_compatibility(collector):
              print("=" * 90)
              print("🔍 RUNNING CUSTOM TYPE COMPATIBILITY ANALYZER")
              print("=" * 90)
              
              import ast
              from collections import defaultdict
              
              def analyze_expr_type(expr):
                  if isinstance(expr, ast.Constant):
                      return type(expr.value).__name__
                  elif isinstance(expr, ast.Call):
                      if isinstance(expr.func, ast.Name):
                          if expr.func.id in ["str", "int", "float", "list", "dict"]:
                              return expr.func.id
                  elif isinstance(expr, ast.BinOp):
                      return "numeric"
                  return "Unknown"
              
              function_returns = {}
              function_calls = defaultdict(list)
              
              for root, _, files in os.walk("."):
                  if any(x in root for x in ["/.git", "/__pycache__", "/venv", "/.venv"]):
                      continue
                  
                  for file in files:
                      if file.endswith(".py"):
                          filepath = os.path.join(root, file)
                          try:
                              with open(filepath, 'r', encoding='utf-8') as f:
                                  tree = ast.parse(f.read())
                              
                              # Collect function return types
                              for node in ast.walk(tree):
                                  if isinstance(node, ast.FunctionDef):
                                      for ret_node in ast.walk(node):
                                          if isinstance(ret_node, ast.Return) and ret_node.value:
                                              ret_type = analyze_expr_type(ret_node.value)
                                              function_returns[node.name] = {
                                                  'type': ret_type,
                                                  'file': filepath,
                                                  'line': node.lineno
                                              }
                                              break
                              
                              # Find function calls and their usage
                              for node in ast.walk(tree):
                                  if isinstance(node, ast.Assign):
                                      if isinstance(node.value, ast.Call):
                                          if isinstance(node.value.func, ast.Name):
                                              func_name = node.value.func.id
                                              
                                              # Check if result is used in numeric operation
                                              for target in node.targets:
                                                  if isinstance(target, ast.Name):
                                                      var_name = target.id
                                                      
                                                      # Find parent function
                                                      parent = None
                                                      for p in ast.walk(tree):
                                                          if isinstance(p, ast.FunctionDef):
                                                              if hasattr(node, 'lineno') and hasattr(p, 'lineno'):
                                                                  if node.lineno >= p.lineno:
                                                                      parent = p
                                                      
                                                      if parent:
                                                          # Check for numeric operations on this variable
                                                          for op_node in ast.walk(parent):
                                                              if isinstance(op_node, ast.BinOp):
                                                                  if isinstance(op_node.left, ast.Name) and op_node.left.id == var_name:
                                                                      function_calls[func_name].append({
                                                                          'file': filepath,
                                                                          'line': op_node.lineno,
                                                                          'operation': type(op_node.op).__name__
                                                                      })
                                                                  elif isinstance(op_node.right, ast.Name) and op_node.right.id == var_name:
                                                                      function_calls[func_name].append({
                                                                          'file': filepath,
                                                                          'line': op_node.lineno,
                                                                          'operation': type(op_node.op).__name__
                                                                      })
                          except:
                              continue
              
              # Check for type mismatches
              for func_name, calls in function_calls.items():
                  if func_name in function_returns:
                      ret_info = function_returns[func_name]
                      if ret_info['type'] == 'str':
                          for call in calls:
                              if call['operation'] in ['Add', 'Sub', 'Mult', 'Div']:
                                  collector.add_error(
                                      "type_mismatch",
                                      f"Function '{func_name}()' returns 'str' but used in numeric operation",
                                      file=call['file'],
                                      line=call['line'],
                                      details={
                                          "Function returns": ret_info['type'],
                                          "Defined in": f"{ret_info['file']}:{ret_info['line']}",
                                          "Operation": call['operation'],
                                          "Fix": "Convert with int() or float(), or change return type"
                                      }
                                  )
              
              collector.add_info("Custom analyzer: Type compatibility check completed")

          # ============================================================================
          # RUN ALL CHECKS
          # ============================================================================
          print("\n" + "=" * 90)
          print("🚀 COMPREHENSIVE CODE ANALYSIS WITH INDUSTRY-STANDARD TOOLS")
          print("=" * 90)

          try:
              check_mypy(collector)
              check_pylint(collector)
              check_bandit(collector)
              check_flake8(collector)
              check_radon(collector)
              check_vulture(collector)
              check_safety(collector)
              check_custom_type_compatibility(collector)
          except Exception as e:
              print(f"\n⚠️  Unexpected error: {e}")
              import traceback
              traceback.print_exc()

          # Print report
          collector.print_report()

          # Exit with error if critical errors found
          if collector.has_errors():
              sys.exit(1)
          EOF

      # --- GENERATE GITHUB SUMMARY ---
      - name: Generate GitHub Summary
        if: always()
        run: |
          echo "# 📊 Advanced Code Quality Analysis Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📌 Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Author:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔧 Tools Used" >> $GITHUB_STEP_SUMMARY
          echo "- **MyPy** - Static type checker" >> $GITHUB_STEP_SUMMARY
          echo "- **PyLint** - Code quality analyzer" >> $GITHUB_STEP_SUMMARY
          echo "- **Bandit** - Security vulnerability scanner" >> $GITHUB_STEP_SUMMARY
          echo "- **Flake8** - Style guide enforcer" >> $GITHUB_STEP_SUMMARY
          echo "- **Radon** - Complexity metrics" >> $GITHUB_STEP_SUMMARY
          echo "- **Vulture** - Dead code detector" >> $GITHUB_STEP_SUMMARY
          echo "- **Safety** - Dependency checker" >> $GITHUB_STEP_SUMMARY
          echo "- **Custom Analyzer** - Type compatibility" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.quality_checks.outcome }}" == "success" ]; then
            echo "## ✅ All Quality Checks Passed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Your code meets professional quality standards." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🎉 **Ready for review and merge!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Quality Checks Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🚨 Critical Issues Detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please review the detailed analysis above. All issues are categorized and include:" >> $GITHUB_STEP_SUMMARY
            echo "- Exact file location and line number" >> $GITHUB_STEP_SUMMARY
            echo "- Severity level (Error/Warning)" >> $GITHUB_STEP_SUMMARY
            echo "- Recommended fixes" >> $GITHUB_STEP_SUMMARY
            echo "- Tool that detected the issue" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 💡 Quick Fixes" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "# Run these commands locally to fix issues:" >> $GITHUB_STEP_SUMMARY
            echo "mypy .              # Check types" >> $GITHUB_STEP_SUMMARY
            echo "pylint .            # Code quality" >> $GITHUB_STEP_SUMMARY
            echo "bandit -r .         # Security scan" >> $GITHUB_STEP_SUMMARY
            echo "flake8 .            # Style check" >> $GITHUB_STEP_SUMMARY
            echo "autopep8 -i -r .    # Auto-fix style" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📝 **Tip:** Fix all errors at once to avoid multiple push cycles!" >> $GITHUB_STEP_SUMMARY
          fi

      # --- COMMIT RESULTS ---
      - name: Commit analysis results
        if: steps.quality_checks.outcome == 'success'
        continue-on-error: true
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Create quality report
          echo "Quality check passed at $(date)" > .quality-check-passed
          git add .quality-check-passed 2>/dev/null || true
          
          git diff --staged --quiet || git commit -m "chore: quality check passed [skip ci]" || true
          git push || echo "Could not push results"
        
        