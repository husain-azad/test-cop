name: Code Quality Checks

on:
  push:
    branches:
      - dev_*
      - feat/*

jobs:
  code-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9.20'

      - name: Install dependencies for checks
        run: |
          python -m pip install --upgrade pip
          pip install mypy flake8 radon pylint astroid bandit

      # --- COMPREHENSIVE CODE QUALITY CHECK (ALL ERRORS AT ONCE) ---
      - name: Run All Code Quality Checks
        id: quality_checks
        run: |
          echo "🔍 Running comprehensive code quality analysis..."
          python <<'EOF'
          import ast
          import os
          import sys
          import json
          import hashlib
          import re
          from collections import defaultdict
          from typing import List, Dict, Set, Tuple, Any

          # ============================================================================
          # GLOBAL ERROR COLLECTOR
          # ============================================================================
          class ErrorCollector:
              def __init__(self):
                  self.errors = []
                  self.warnings = []
                  self.info = []
                  
              def add_error(self, category, message, file=None, line=None, details=None):
                  self.errors.append({
                      "category": category,
                      "message": message,
                      "file": file,
                      "line": line,
                      "details": details or {}
                  })
              
              def add_warning(self, category, message, file=None, line=None, details=None):
                  self.warnings.append({
                      "category": category,
                      "message": message,
                      "file": file,
                      "line": line,
                      "details": details or {}
                  })
              
              def add_info(self, category, message):
                  self.info.append({
                      "category": category,
                      "message": message
                  })
              
              def has_errors(self):
                  return len(self.errors) > 0
              
              def print_report(self):
                  print("\n" + "=" * 80)
                  print("📊 COMPREHENSIVE CODE QUALITY REPORT")
                  print("=" * 80)
                  
                  if self.errors:
                      print(f"\n❌ ERRORS FOUND: {len(self.errors)}")
                      print("=" * 80)
                      
                      # Group errors by category
                      by_category = defaultdict(list)
                      for err in self.errors:
                          by_category[err['category']].append(err)
                      
                      for category, errs in sorted(by_category.items()):
                          print(f"\n🔴 {category.upper().replace('_', ' ')} ({len(errs)} issue(s)):")
                          print("-" * 80)
                          for i, err in enumerate(errs, 1):
                              print(f"\n  {i}. {err['message']}")
                              if err['file']:
                                  location = f"{err['file']}"
                                  if err['line']:
                                      location += f":{err['line']}"
                                  print(f"     📁 Location: {location}")
                              if err['details']:
                                  for key, value in err['details'].items():
                                      print(f"     ℹ️  {key}: {value}")
                  
                  if self.warnings:
                      print(f"\n⚠️  WARNINGS FOUND: {len(self.warnings)}")
                      print("=" * 80)
                      
                      by_category = defaultdict(list)
                      for warn in self.warnings:
                          by_category[warn['category']].append(warn)
                      
                      for category, warns in sorted(by_category.items()):
                          print(f"\n🟡 {category.upper().replace('_', ' ')} ({len(warns)} issue(s)):")
                          print("-" * 80)
                          for i, warn in enumerate(warns[:10], 1):  # Show first 10 per category
                              print(f"  {i}. {warn['message']}")
                              if warn['file']:
                                  location = f"{warn['file']}"
                                  if warn['line']:
                                      location += f":{warn['line']}"
                                  print(f"     📁 {location}")
                              if warn.get('details'):
                                  for key, value in list(warn['details'].items())[:3]:
                                      print(f"     ℹ️  {key}: {value}")
                          if len(warns) > 10:
                              print(f"  ... and {len(warns) - 10} more {category} warnings")
                  
                  if self.info:
                      print(f"\n✅ PASSED CHECKS: {len(self.info)}")
                      for inf in self.info:
                          print(f"  ✓ {inf['message']}")
                  
                  print("\n" + "=" * 80)
                  if self.errors:
                      print("❌ BUILD FAILED - Please fix all errors above")
                      print("=" * 80)
                      print("\n💡 TIP: Fix all errors at once to avoid multiple push cycles")
                      print("📝 Review each error carefully and update your code accordingly")
                  else:
                      print("✅ ALL CHECKS PASSED - Code quality standards met!")
                      print("=" * 80)

          collector = ErrorCollector()

          # ============================================================================
          # HELPER: Skip common directories
          # ============================================================================
          def should_skip_dir(root):
              skip_patterns = ["/.git", "/__pycache__", "/venv", "/env", "/.venv", 
                             "/node_modules", "/.pytest_cache", "/.mypy_cache", "/dist", "/build"]
              return any(pattern in root for pattern in skip_patterns)

          # ============================================================================
          # 1. SYNTAX CHECK
          # ============================================================================
          def check_syntax(collector):
              print("🔍 Checking syntax errors...")
              syntax_errors = []
              
              for root, _, files in os.walk("."):
                  if should_skip_dir(root):
                      continue
                  for f in files:
                      if f.endswith(".py"):
                          path = os.path.join(root, f)
                          try:
                              with open(path, "r", encoding="utf-8") as file:
                                  compile(file.read(), path, 'exec')
                          except SyntaxError as e:
                              collector.add_error(
                                  "syntax",
                                  f"Syntax error in {f}",
                                  file=path,
                                  line=e.lineno,
                                  details={"Error": str(e.msg), "Fix": "Check Python syntax at the specified line"}
                              )
                              syntax_errors.append(path)
                          except Exception as e:
                              collector.add_warning(
                                  "file_read",
                                  f"Could not read file {f}: {str(e)}",
                                  file=path
                              )
              
              if not syntax_errors:
                  collector.add_info("syntax", "No syntax errors found")

          # ============================================================================
          # 2. TYPE COMPATIBILITY CHECK
          # ============================================================================
          def analyze_expr_type(expr):
              """Analyze expression to determine its type"""
              if isinstance(expr, ast.Constant):
                  return type(expr.value).__name__
              elif isinstance(expr, ast.List):
                  if expr.elts:
                      elem_types = {analyze_expr_type(e) for e in expr.elts}
                      if len(elem_types) == 1:
                          return f"List[{elem_types.pop()}]"
                      return "List[Mixed]"
                  return "List"
              elif isinstance(expr, ast.Dict):
                  return "Dict"
              elif isinstance(expr, ast.Tuple):
                  return "Tuple"
              elif isinstance(expr, ast.Set):
                  return "Set"
              elif isinstance(expr, ast.Call):
                  if isinstance(expr.func, ast.Name):
                      if expr.func.id in ["str", "int", "float", "list", "dict", "tuple", "set", "bool"]:
                          return expr.func.id
                      return f"ReturnOf[{expr.func.id}]"
                  elif isinstance(expr.func, ast.Attribute):
                      return f"ReturnOf[{expr.func.attr}]"
                  return "Unknown"
              elif isinstance(expr, ast.BinOp):
                  left_type = analyze_expr_type(expr.left)
                  right_type = analyze_expr_type(expr.right)
                  if "str" in [left_type, right_type]:
                      return "str"
                  if "float" in [left_type, right_type]:
                      return "float"
                  return "int"
              elif isinstance(expr, ast.Name):
                  return f"Variable[{expr.id}]"
              return "Unknown"

          def infer_return_type_deep(func_node):
              """Deep inference of return types"""
              return_types = set()
              
              for node in ast.walk(func_node):
                  if isinstance(node, ast.Return) and node.value:
                      ret_type = analyze_expr_type(node.value)
                      return_types.add(ret_type)
              
              if len(return_types) > 1:
                  return f"Mixed[{','.join(sorted(return_types))}]"
              return return_types.pop() if return_types else "None"

          def find_operations_on_variable(func_node, var_name):
              """Find what operations are performed on a variable"""
              operations = []
              
              for node in ast.walk(func_node):
                  if isinstance(node, ast.BinOp):
                      left_name = None
                      right_name = None
                      
                      if isinstance(node.left, ast.Name):
                          left_name = node.left.id
                      if isinstance(node.right, ast.Name):
                          right_name = node.right.id
                      
                      if left_name == var_name or right_name == var_name:
                          op_type = type(node.op).__name__
                          operations.append({
                              "operation": op_type,
                              "line": node.lineno,
                              "expects": "numeric" if op_type in ["Add", "Sub", "Mult", "Div", "Mod", "FloorDiv", "Pow"] else "any"
                          })
              
              return operations

          def check_type_compatibility(collector):
              print("🔬 Analyzing type compatibility...")
              
              function_info = {}
              call_usage = defaultdict(list)
              
              # Collect all function signatures
              for root, _, files in os.walk("."):
                  if should_skip_dir(root):
                      continue
                  for f in files:
                      if f.endswith(".py"):
                          path = os.path.join(root, f)
                          rel_path = os.path.relpath(path, ".")
                          
                          try:
                              with open(path, "r", encoding="utf-8") as file:
                                  tree = ast.parse(file.read(), filename=f)
                              
                              for node in ast.walk(tree):
                                  if isinstance(node, ast.FunctionDef):
                                      return_type = infer_return_type_deep(node)
                                      annotated_return = ast.unparse(node.returns) if node.returns else None
                                      
                                      function_info[node.name] = {
                                          "file": rel_path,
                                          "line": node.lineno,
                                          "returns": return_type,
                                          "annotated_return": annotated_return
                                      }
                          except SyntaxError:
                              continue
                          except Exception:
                              continue
              
              # Analyze how functions are used
              for root, _, files in os.walk("."):
                  if should_skip_dir(root):
                      continue
                  for f in files:
                      if f.endswith(".py"):
                          path = os.path.join(root, f)
                          rel_path = os.path.relpath(path, ".")
                          
                          try:
                              with open(path, "r", encoding="utf-8") as file:
                                  tree = ast.parse(file.read(), filename=f)
                              
                              for node in ast.walk(tree):
                                  if isinstance(node, ast.Assign):
                                      if isinstance(node.value, ast.Call):
                                          func_name = None
                                          if isinstance(node.value.func, ast.Name):
                                              func_name = node.value.func.id
                                          elif isinstance(node.value.func, ast.Attribute):
                                              func_name = node.value.func.attr
                                          
                                          if func_name and func_name in function_info:
                                              for target in node.targets:
                                                  if isinstance(target, ast.Name):
                                                      var_name = target.id
                                                      
                                                      parent_func = None
                                                      for pnode in ast.walk(tree):
                                                          if isinstance(pnode, ast.FunctionDef):
                                                              if hasattr(pnode, 'end_lineno'):
                                                                  if node.lineno >= pnode.lineno and node.lineno <= pnode.end_lineno:
                                                                      parent_func = pnode
                                                              elif node.lineno >= pnode.lineno:
                                                                  parent_func = pnode
                                                      
                                                      if parent_func:
                                                          ops = find_operations_on_variable(parent_func, var_name)
                                                          
                                                          for op in ops:
                                                              call_usage[func_name].append({
                                                                  "called_in_file": rel_path,
                                                                  "called_in_func": parent_func.name,
                                                                  "call_line": node.lineno,
                                                                  "usage_line": op["line"],
                                                                  "operation": op["operation"],
                                                                  "expects": op["expects"]
                                                              })
                          except SyntaxError:
                              continue
                          except Exception:
                              continue
              
              # Check compatibility
              type_errors_found = False
              for func_name, usages in call_usage.items():
                  if func_name not in function_info:
                      continue
                  
                  func_data = function_info[func_name]
                  return_type = func_data["returns"]
                  
                  for usage in usages:
                      expected = usage["expects"]
                      
                      if expected == "numeric":
                          if "str" in return_type.lower():
                              collector.add_error(
                                  "type_mismatch",
                                  f"Function '{func_name}()' returns '{return_type}' but used in numeric operation '{usage['operation']}'",
                                  file=usage["called_in_file"],
                                  line=usage["usage_line"],
                                  details={
                                      "Function defined in": f"{func_data['file']}:{func_data['line']}",
                                      "Called in function": usage["called_in_func"],
                                      "Call line": usage["call_line"],
                                      "Returns": return_type,
                                      "Used as": "numeric",
                                      "Fix": "Change return type to int/float OR convert: int(result) or float(result)"
                                  }
                              )
                              type_errors_found = True
                          elif "List" in return_type or "Dict" in return_type or "Tuple" in return_type:
                              collector.add_warning(
                                  "type_compatibility",
                                  f"Function '{func_name}()' returns '{return_type}' used in numeric operation - may cause TypeError",
                                  file=usage["called_in_file"],
                                  line=usage["usage_line"],
                                  details={
                                      "Function": func_name,
                                      "Suggestion": "Verify this is intentional or add proper type conversion"
                                  }
                              )
              
              if not type_errors_found and call_usage:
                  collector.add_info("type_check", "All function return types are compatible with their usage")
              elif not call_usage:
                  collector.add_info("type_check", "No cross-function type dependencies detected")

          # ============================================================================
          # 3. FUNCTION SIGNATURE CHANGES
          # ============================================================================
          def check_function_changes(collector):
              print("🧩 Checking function signature changes...")
              
              def get_function_signatures(directory):
                  signatures = {}
                  for root, _, files in os.walk(directory):
                      if should_skip_dir(root):
                          continue
                      for f in files:
                          if f.endswith(".py"):
                              path = os.path.join(root, f)
                              rel_path = os.path.relpath(path, directory)
                              try:
                                  with open(path, "r", encoding="utf-8") as file:
                                      tree = ast.parse(file.read(), filename=f)
                                  
                                  for node in ast.walk(tree):
                                      if isinstance(node, ast.FunctionDef):
                                          returns = ast.unparse(node.returns) if node.returns else ""
                                          if not returns:
                                              returns = infer_return_type_deep(node)
                                          
                                          signatures[f"{rel_path}:{node.name}"] = {
                                              "args": [a.arg for a in node.args.args],
                                              "defaults": len(node.args.defaults),
                                              "returns": returns,
                                              "file": rel_path,
                                              "line": node.lineno,
                                          }
                              except SyntaxError:
                                  continue
                              except Exception:
                                  continue
                  return signatures
              
              def find_function_calls(directory):
                  calls = defaultdict(list)
                  for root, _, files in os.walk(directory):
                      if should_skip_dir(root):
                          continue
                      for f in files:
                          if f.endswith(".py"):
                              path = os.path.join(root, f)
                              rel_path = os.path.relpath(path, directory)
                              try:
                                  with open(path, "r", encoding="utf-8") as file:
                                      tree = ast.parse(file.read(), filename=f)
                                  
                                  for node in ast.walk(tree):
                                      if isinstance(node, ast.Call):
                                          func_name = None
                                          if isinstance(node.func, ast.Name):
                                              func_name = node.func.id
                                          elif isinstance(node.func, ast.Attribute):
                                              func_name = node.func.attr
                                          
                                          if func_name:
                                              calls[func_name].append({
                                                  "file": rel_path,
                                                  "line": node.lineno
                                              })
                              except SyntaxError:
                                  continue
                              except Exception:
                                  continue
                  return calls
              
              SNAPSHOT_FILE = ".code_signatures_snapshot.json"
              
              old_signatures = {}
              if os.path.exists(SNAPSHOT_FILE):
                  try:
                      with open(SNAPSHOT_FILE) as f:
                          old_signatures = json.load(f)
                  except Exception:
                      old_signatures = {}
              
              new_signatures = get_function_signatures(".")
              function_calls = find_function_calls(".")
              
              breaking_changes_found = False
              for func_path, info in new_signatures.items():
                  func_name = func_path.split(":")[-1]
                  
                  if func_path in old_signatures:
                      old_info = old_signatures[func_path]
                      changes = []
                      
                      if old_info["args"] != info["args"]:
                          if len(old_info["args"]) != len(info["args"]):
                              changes.append(f"parameter count: {len(old_info['args'])} → {len(info['args'])}")
                          else:
                              changes.append(f"parameter names: {old_info['args']} → {info['args']}")
                      
                      if old_info["returns"] != info["returns"]:
                          old_ret = old_info["returns"] or "None"
                          new_ret = info["returns"] or "None"
                          changes.append(f"return type: {old_ret} → {new_ret}")
                      
                      if old_info.get("defaults", 0) != info.get("defaults", 0):
                          changes.append("default arguments changed")
                      
                      if changes:
                          call_locations = function_calls.get(func_name, [])
                          cross_file_calls = [loc for loc in call_locations if loc["file"] != info["file"]]
                          
                          change_desc = ", ".join(changes)
                          
                          if cross_file_calls:
                              calls_desc = ", ".join([f"{loc['file']}:{loc['line']}" for loc in cross_file_calls[:3]])
                              if len(cross_file_calls) > 3:
                                  calls_desc += f" +{len(cross_file_calls)-3} more"
                              
                              collector.add_error(
                                  "breaking_change",
                                  f"Function '{func_name}' signature changed: {change_desc}",
                                  file=info["file"],
                                  line=info["line"],
                                  details={
                                      "Changes": change_desc,
                                      "Called in": calls_desc,
                                      "Impact": f"{len(cross_file_calls)} file(s) affected",
                                      "Action": "Update all calling code to match new signature"
                                  }
                              )
                              breaking_changes_found = True
                          else:
                              collector.add_warning(
                                  "signature_change",
                                  f"Function '{func_name}' signature changed: {change_desc}",
                                  file=info["file"],
                                  line=info["line"]
                              )
              
              # Save new snapshot
              with open(SNAPSHOT_FILE, "w") as f:
                  json.dump(new_signatures, f, indent=2)
              
              if not breaking_changes_found:
                  collector.add_info("function_changes", "No breaking function signature changes detected")

          # ============================================================================
          # 4. CODE DUPLICATION CHECK
          # ============================================================================
          def check_duplication(collector):
              print("🔄 Checking code duplication...")
              
              blocks = defaultdict(list)
              for root, _, files in os.walk("."):
                  if should_skip_dir(root):
                      continue
                  for f in files:
                      if f.endswith(".py"):
                          path = os.path.join(root, f)
                          try:
                              with open(path, "r", encoding="utf-8") as file:
                                  tree = ast.parse(file.read())
                              
                              for node in ast.walk(tree):
                                  if isinstance(node, (ast.FunctionDef, ast.ClassDef)):
                                      code = ast.unparse(node)
                                      if len(code) > 150:  # Only substantial blocks
                                          code_hash = hashlib.md5(code.encode()).hexdigest()
                                          blocks[code_hash].append(f"{path}:{node.name}")
                          except SyntaxError:
                              continue
                          except Exception:
                              continue
              
              duplicates = {k: v for k, v in blocks.items() if len(v) > 1}
              
              for locations in duplicates.values():
                  collector.add_warning(
                      "duplication",
                      f"Duplicate code block detected",
                      details={"Locations": ", ".join(locations), "Suggestion": "Consider refactoring into a shared function"}
                  )
              
              if not duplicates:
                  collector.add_info("duplication", "No significant code duplication detected")

          # ============================================================================
          # 5. SECURITY CHECK
          # ============================================================================
          def check_security(collector):
              print("🔒 Checking security patterns...")
              
              PATTERNS = {
                  r'eval\(': ('Dangerous eval() usage', 'Avoid eval() - use safer alternatives like ast.literal_eval()'),
                  r'exec\(': ('Dangerous exec() usage', 'Avoid exec() - consider safer alternatives'),
                  r'pickle\.loads': ('Unsafe pickle.loads', 'Use JSON or other safe serialization formats'),
                  r'shell=True': ('shell=True in subprocess', 'Use shell=False and pass command as list'),
                  r'password\s*=\s*["\'][^"\']+["\']': ('Hardcoded password', 'Use environment variables or secure config'),
                  r'api[_-]?key\s*=\s*["\'][^"\']+["\']': ('Hardcoded API key', 'Use environment variables'),
                  r'SECRET\s*=\s*["\'][^"\']+["\']': ('Hardcoded secret', 'Use environment variables or secrets manager'),
              }
              
              security_issues = 0
              for root, _, files in os.walk("."):
                  if should_skip_dir(root):
                      continue
                  for f in files:
                      if f.endswith(".py"):
                          path = os.path.join(root, f)
                          try:
                              with open(path, "r", encoding="utf-8") as file:
                                  for i, line in enumerate(file, 1):
                                      for pattern, (desc, fix) in PATTERNS.items():
                                          if re.search(pattern, line, re.IGNORECASE):
                                              collector.add_warning(
                                                  "security",
                                                  desc,
                                                  file=path,
                                                  line=i,
                                                  details={"Fix": fix}
                                              )
                                              security_issues += 1
                          except Exception:
                              continue
              
              if security_issues == 0:
                  collector.add_info("security", "No obvious security issues detected")

          # ============================================================================
          # 6. IMPORT CHECKS
          # ============================================================================
          def check_imports(collector):
              print("📦 Checking imports...")
              
              unused_found = False
              for root, _, files in os.walk("."):
                  if should_skip_dir(root):
                      continue
                  for f in files:
                      if f.endswith(".py"):
                          path = os.path.join(root, f)
                          try:
                              with open(path, "r", encoding="utf-8") as file:
                                  tree = ast.parse(file.read())
                              
                              imports = set()
                              used_names = set()
                              
                              for node in ast.walk(tree):
                                  if isinstance(node, ast.Import):
                                      for alias in node.names:
                                          imports.add(alias.asname or alias.name.split('.')[0])
                                  elif isinstance(node, ast.ImportFrom):
                                      for alias in node.names:
                                          if alias.name != '*':
                                              imports.add(alias.asname or alias.name)
                                  elif isinstance(node, ast.Name):
                                      used_names.add(node.id)
                              
                              unused = imports - used_names
                              if unused and len(unused) > 2:  # Only warn if more than 2 unused
                                  collector.add_warning(
                                      "unused_imports",
                                      f"Unused imports: {', '.join(sorted(unused))}",
                                      file=path,
                                      details={"Fix": "Remove unused imports to keep code clean"}
                                  )
                                  unused_found = True
                          except SyntaxError:
                              continue
                          except Exception:
                              continue
              
              if not unused_found:
                  collector.add_info("imports", "No significant unused imports detected")

          # ============================================================================
          # 7. CODE COMPLEXITY CHECK
          # ============================================================================
          def check_complexity(collector):
              print("⚙️  Checking code complexity...")
              
              complex_functions = 0
              for root, _, files in os.walk("."):
                  if should_skip_dir(root):
                      continue
                  for f in files:
                      if f.endswith(".py"):
                          path = os.path.join(root, f)
                          try:
                              with open(path, "r", encoding="utf-8") as file:
                                  tree = ast.parse(file.read())
                              
                              for node in ast.walk(tree):
                                  if isinstance(node, ast.FunctionDef):
                                      # Cyclomatic complexity calculation
                                      complexity = 1 + sum(1 for _ in ast.walk(node) 
                                                         if isinstance(_, (ast.If, ast.While, ast.For, 
                                                                         ast.ExceptHandler, ast.With, 
                                                                         ast.Assert, ast.BoolOp)))
                                      
                                      if complexity > 10:
                                          collector.add_warning(
                                              "complexity",
                                              f"High complexity ({complexity}) in function '{node.name}'",
                                              file=path,
                                              line=node.lineno,
                                              details={"Suggestion": "Consider breaking this function into smaller functions"}
                                          )
                                          complex_functions += 1
                          except SyntaxError:
                              continue
                          except Exception:
                              continue
              
              if complex_functions == 0:
                  collector.add_info("complexity", "All functions have acceptable complexity")

          # ============================================================================
          # RUN ALL CHECKS
          # ============================================================================
          print("\n" + "=" * 80)
          print("🚀 STARTING COMPREHENSIVE CODE ANALYSIS")
          print("=" * 80 + "\n")

          try:
              check_syntax(collector)
              check_type_compatibility(collector)
              check_function_changes(collector)
              check_duplication(collector)
              check_security(collector)
              check_imports(collector)
              check_complexity(collector)
          except Exception as e:
              print(f"\n⚠️  Unexpected error during analysis: {str(e)}")
              print("Continuing with partial results...\n")

          # Print comprehensive report
          collector.print_report()

          # Exit with error if there are errors
          if collector.has_errors():
              sys.exit(1)
          EOF

      # --- ADDITIONAL STATIC ANALYSIS (NON-BLOCKING) ---
      - name: Run additional linting (non-blocking)
        continue-on-error: true
        run: |
          echo ""
          echo "🎨 Running additional static analysis tools..."
          echo "================================================"
          
          echo "📝 Flake8 linting..."
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics 2>&1 || true
          
          echo ""
          echo "📊 Radon complexity analysis..."
          radon cc . -a -nc 2>&1 || true
          
          echo ""
          echo "🔍 MyPy type checking (informational)..."
          mypy --ignore-missing-imports --no-error-summary . 2>&1 | head -20 || true

      # --- GENERATE GITHUB SUMMARY ---
      - name: Generate GitHub Summary
        if: always()
        run: |
          echo "# 📊 Code Quality Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📌 Commit Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check if main analysis step succeeded
          if [ "${{ steps.quality_checks.outcome }}" == "success" ]; then
            echo "## ✅ All Quality Checks Passed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Your code meets all quality standards:" >> $GITHUB_STEP_SUMMARY
            echo "- ✓ No syntax errors" >> $GITHUB_STEP_SUMMARY
            echo "- ✓ No type mismatches" >> $GITHUB_STEP_SUMMARY
            echo "- ✓ No breaking changes" >> $GITHUB_STEP_SUMMARY
            echo "- ✓ Code quality is acceptable" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🎉 **Ready to merge!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Quality Checks Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🚨 Action Required" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please review the detailed error report in the job logs above." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 💡 Tips for Fixing" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "1. **Review all errors at once** - All issues are displayed together" >> $GITHUB_STEP_SUMMARY
            echo "2. **Fix by category** - Group similar fixes together" >> $GITHUB_STEP_SUMMARY
            echo "3. **Check the 'Fix' suggestions** - Each error includes a recommended solution" >> $GITHUB_STEP_SUMMARY
            echo "4. **Test locally first** - Run \`python -m compileall .\` before pushing" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔍 Common Issues" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Type Mismatch:** Function returns string but used as number → Convert with \`int()\` or \`float()\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Breaking Change:** Function signature changed → Update all callers" >> $GITHUB_STEP_SUMMARY
            echo "- **Syntax Error:** Invalid Python code → Check the line number in error" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📝 **Remember:** Fix all errors in one commit to avoid multiple push cycles!" >> $GITHUB_STEP_SUMMARY
          fi

      # --- COMMIT SNAPSHOT FILE ---
      - name: Commit signature snapshot
        if: steps.quality_checks.outcome == 'success'
        continue-on-error: true
        run: |
          # Check if snapshot file exists
          if [ -f ".code_signatures_snapshot.json" ]; then
            echo "📸 Snapshot file found, preparing to commit..."
            
            # Configure git with bot credentials
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            
            # Add snapshot file to staging
            git add .code_signatures_snapshot.json
            
            # Check if there are changes to commit
            if git diff --staged --quiet; then
              echo "✅ No changes in snapshot file, skipping commit"
            else
              echo "💾 Committing snapshot changes..."
              git commit -m "chore: update code signature snapshot [skip ci]"
              
              # Try to push, but don't fail if it doesn't work
              if git push; then
                echo "✅ Snapshot committed and pushed successfully"
              else
                echo "⚠️  Could not push snapshot - this is okay (might need permissions)"
              fi
            fi
          else
            echo "ℹ️  No snapshot file to commit"
          fi