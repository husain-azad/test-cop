name: 🧠 Python Code Quality Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, master, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 mypy pylint bandit pytest

      # 1️⃣ Check for syntax/import errors
      - name: 🧩 Check Python syntax & imports
        run: |
          echo "Running basic syntax and import checks..."
          python -m compileall . || exit 1
          python -c "import pkgutil; [pkgutil.find_loader(m) for m in ['sys', 'os']]"

      # 2️⃣ Code formatting check
      - name: 🧹 Run Black (formatting)
        run: black --check --diff .

      - name: 🔤 Run isort (import sorting)
        run: isort --check-only --diff .

      # 3️⃣ Linting for style and logic issues
      - name: 🔍 Run Flake8 (linting)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: 🧠 Run Pylint (code analysis)
        run: |
          pylint $(git ls-files '*.py') --exit-zero

      # 4️⃣ Static typing checks
      - name: 🧾 Run Mypy (type checking)
        run: |
          mypy . --ignore-missing-imports --show-error-codes --pretty

      # 5️⃣ Security check
      - name: 🔒 Run Bandit (security)
        run: |
          bandit -r . -ll

      # 6️⃣ Optional: Run tests if exists
      - name: 🧪 Run Pytest (unit tests)
        run: |
          if [ -d "tests" ]; then
            pytest -q --disable-warnings || exit 1
          else
            echo "No tests directory found. Skipping pytest."
          fi

      # 7️⃣ Summary result (always run)
      - name: ✅ Summary
        if: always()
        run: |
          echo "✅ All checks completed!"
