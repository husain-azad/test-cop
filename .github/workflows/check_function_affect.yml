name: 🧠 Python Code Quality & Safety Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, master, develop]
  push:
    branches: [main, master, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    continue-on-error: false
    timeout-minutes: 25

    steps:
      - name: 🛒 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ⚡ Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 mypy pylint bandit pytest

      # 🧩 Run all checks but don’t stop on first failure
      - name: 🚀 Run all static checks
        id: run_checks
        continue-on-error: true
        run: |
          echo "-------------------- CODE QUALITY CHECKS START --------------------"
          echo "" > all_errors.log

          echo "🧹 Running Black..." | tee -a all_errors.log
          black --check . || echo "❌ Black formatting failed" >> all_errors.log

          echo "🔤 Running isort..." | tee -a all_errors.log
          isort --check-only . || echo "❌ isort import sorting failed" >> all_errors.log

          echo "🔍 Running Flake8..." | tee -a all_errors.log
          flake8 . || echo "❌ Flake8 linting failed" >> all_errors.log

          echo "🧠 Running Pylint..." | tee -a all_errors.log
          pylint $(git ls-files '*.py') --exit-zero | tee pylint_report.log
          if grep -q "Your code has been rated at [0-9]\.[0-9]/10" pylint_report.log; then
            echo "Pylint completed."
          else
            echo "❌ Pylint found issues" >> all_errors.log
          fi

          echo "🧾 Running Mypy..." | tee -a all_errors.log
          mypy . --ignore-missing-imports || echo "❌ Mypy type checking failed" >> all_errors.log

          echo "🔒 Running Bandit..." | tee -a all_errors.log
          bandit -r . -ll || echo "❌ Bandit security issues found" >> all_errors.log

          echo "🧪 Running Pytest..." | tee -a all_errors.log
          if [ -d "tests" ]; then
            pytest -q --disable-warnings || echo "❌ Pytest failed" >> all_errors.log
          else
            echo "⚠️ No tests folder found. Skipping pytest." >> all_errors.log
          fi

          echo "-------------------- CODE QUALITY CHECKS END --------------------"
          cat all_errors.log

          # Fail the job if file contains "❌"
          if grep -q "❌" all_errors.log; then
            echo "One or more checks failed ❌"
            exit 1
          fi

      # ✅ Summary output
      - name: ✅ Summary
        if: always()
        run: |
          echo "✅ Code Quality Check completed. Review logs above."
