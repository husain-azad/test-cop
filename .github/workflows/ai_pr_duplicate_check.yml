name: AI PR Duplicate Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-pr-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # -------------------------------
      # 1. Checkout PR (HEAD) and Base
      # -------------------------------
      - name: Checkout HEAD (PR branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: head

      - name: Checkout BASE (target branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          path: base

      # -------------------------------
      # 2. Python Environment Setup
      # -------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9.20'

      # -------------------------------
      # 3. Install Dependencies
      # -------------------------------
      - name: Install minimal deps for duplicate + dependency check
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests mypy
          # Type stubs for better MyPy analysis
          pip install types-requests types-PyYAML
          # Optional dependencies for future AI reasoning
          # pip install openai rapidfuzz

      # -------------------------------
      # 4. Generate OpenAPI Schemas
      # -------------------------------
      - name: Generate OpenAPI (BASE)
        working-directory: base
        env:
          DJANGO_SETTINGS_MODULE: crbrm.settings
        run: |
          python manage.py generateschema > /tmp/openapi_base.json || echo '{}' > /tmp/openapi_base.json

      - name: Generate OpenAPI (HEAD)
        working-directory: head
        env:
          DJANGO_SETTINGS_MODULE: crbrm.settings
        run: |
          python manage.py generateschema > /tmp/openapi_head.json || echo '{}' > /tmp/openapi_head.json

      # -------------------------------
      # 5. Run MyPy Static Analysis
      # -------------------------------
      - name: Run MyPy static analysis
        working-directory: head
        run: |
          echo "Running MyPy static analysis..."
          mypy --install-types --non-interactive --ignore-missing-imports scripts/ai_pr_check.py || true

      # -------------------------------
      # 6. Run Duplicate + Dependency Check Script
      # -------------------------------
      - name: Run duplicate + dependency checks and comment on PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_DIR: ${{ github.workspace }}/base
          HEAD_DIR: ${{ github.workspace }}/head
          OPENAPI_BASE: /tmp/openapi_base.json
          OPENAPI_HEAD: /tmp/openapi_head.json
        working-directory: head
        run: |
          python scripts/ai_pr_check.py
